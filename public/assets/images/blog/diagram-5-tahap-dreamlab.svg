<svg viewBox="0 0 700 680" xmlns="http://www.w3.org/2000/svg" role="img">
<title>5 Tahap Membuat Brand di Dreamlab</title>
<desc>Diagram alur lima tahap: Konsultasi Awal, Riset dan Pembuatan Sampel, Pengurusan Legalitas, Produksi Massal, Dukungan Marketing.</desc>
<rect x="0" y="0" width="700" height="680" fill="#ffffff"/>
<text x="30" y="48" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#1a1a1a">5 Tahap Membuat Brand di Dreamlab</text>

<line x1="60" y1="110" x2="60" y2="630" stroke="#d9d9d9" stroke-width="2"/>

<!-- Step 1 -->
<circle cx="60" cy="110" r="28" fill="#f5f5f5" stroke="#4a4a4a" stroke-width="2"/>
<text x="60" y="118" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">1</text>
<text x="112" y="104" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">Konsultasi Awal</text>
<text x="112" y="126" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#595959">Diskusi ide, target, dan budget</text>

<!-- Step 2 -->
<circle cx="60" cy="240" r="28" fill="#f5f5f5" stroke="#4a4a4a" stroke-width="2"/>
<text x="60" y="248" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">2</text>
<text x="112" y="234" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">Riset &amp; Pembuatan Sampel</text>
<text x="112" y="256" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#595959">Formula eksklusif, sampel fisik direvisi</text>

<!-- Step 3 -->
<circle cx="60" cy="370" r="28" fill="#f5f5f5" stroke="#4a4a4a" stroke-width="2"/>
<text x="60" y="378" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">3</text>
<text x="112" y="364" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">Pengurusan Legalitas</text>
<text x="112" y="386" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#595959">BPOM, Halal MUI, HKI</text>

<!-- Step 4 -->
<circle cx="60" cy="500" r="28" fill="#f5f5f5" stroke="#4a4a4a" stroke-width="2"/>
<text x="60" y="508" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">4</text>
<text x="112" y="494" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">Produksi Massal</text>
<text x="112" y="516" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#595959">Sesuai MOQ yang fleksibel</text>

<!-- Step 5 -->
<circle cx="60" cy="630" r="28" fill="#f5f5f5" stroke="#4a4a4a" stroke-width="2"/>
<text x="60" y="638" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#b45309" text-anchor="middle">5</text>
<text x="112" y="624" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1a1a1a">Dukungan Marketing</text>
<text x="112" y="646" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#595959">Positioning &amp; strategi jual</text>
</svg>
